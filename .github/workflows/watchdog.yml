name: Watchdog

# The alert that was missing.
#
# Every existing alert in this repo fires when a job FAILS. Not one of them
# fires when a job quietly succeeds at doing nothing, which is precisely what
# happened: the morning run exited 0 every day for three weeks after halting
# at the guardrail, and no failure alert could ever have caught it.
#
# This job asks a different question: which pipeline stages have not
# SUCCEEDED recently? A stage that runs daily and halts daily looks alive to
# every other monitor and dead to this one.
#
# 22:30 UTC = 6:30pm ET, after the evening review has written its status.

on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Evaluate pipeline health
        id: check
        run: |
          python - <<'EOF'
          import os, json, sys
          sys.path.insert(0, ".")
          import health

          data = health.read()
          stale = health.stale(max_trading_days=2)

          print(json.dumps(data, indent=2))
          print()
          if not data["stages"]:
              print("No health data yet — nothing to evaluate.")
              msg = ""
          elif stale:
              lines = [f"{s}: no successful run in {d} trading day(s) "
                       f"(last status {st}) {det[:80]}"
                       for s, d, st, det in stale]
              msg = "PIPELINE STALE\n" + "\n".join(lines)
              print(msg)
          else:
              print("All stages healthy.")
              msg = ""

          # An explicit boolean, not "is this string empty". A heredoc block
          # containing a single blank line does not reliably compare equal to
          # '' in the Actions expression language, which would page daily.
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"stale={'true' if msg else 'false'}\n")
              f.write("alert<<EOM\n" + (msg or "none") + "\nEOM\n")
          EOF

      - name: Notify if stale
        if: steps.check.outputs.stale == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT: ${{ steps.check.outputs.alert }}
        run: |
          python - <<'EOF'
          import os, urllib.request
          topic = os.environ.get("NTFY_TOPIC", "").strip()
          body = os.environ.get("ALERT", "").strip()
          if not topic or not body:
              raise SystemExit(0)
          req = urllib.request.Request(
              f"https://ntfy.sh/{topic}", data=body.encode(),
              headers={"Title": "Claude Trader: PIPELINE STALE",
                       "Tags": "warning", "Priority": "high"})
          urllib.request.urlopen(req, timeout=30)
          print("Alert sent.")
          EOF

      # A watchdog that only pages you is a watchdog you can miss. Failing the
      # job puts a red X on the Actions tab, which is visible without a phone.
      - name: Fail the run so the outage is visible in Actions
        if: steps.check.outputs.stale == 'true'
        run: |
          echo "${{ steps.check.outputs.alert }}"
          exit 1
