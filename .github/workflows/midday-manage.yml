name: Midday Position Management

on:
  schedule:
    # 16:40 UTC = 12:40pm ET during EDT. Actions cron can lag, so this
    # lands roughly 12:40-1:00pm ET — squarely midday.
    # NOTE: When clocks change to EST in November, update to '40 17 * * 1-5'.
    - cron: '40 16 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: midday-manage
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      # Fail-open, same as eod-flatten: a failed status probe must not silently
      # cancel the midday manager. midday.jsonl and eod.jsonl BOTH stop on
      # 2026-07-16 — these are the only two workflows gated this way.
      - name: Skip if US market holiday
        id: holiday
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python - <<'EOF'
          import os, requests
          from datetime import datetime
          from zoneinfo import ZoneInfo
          headers = {
              "APCA-API-KEY-ID": os.environ["ALPACA_API_KEY"],
              "APCA-API-SECRET-KEY": os.environ["ALPACA_SECRET_KEY"],
          }
          today = datetime.now(ZoneInfo("America/New_York")).date().isoformat()
          r = requests.get(
              "https://paper-api.alpaca.markets/v2/calendar",
              headers=headers, params={"start": today, "end": today}, timeout=30)
          r.raise_for_status()
          is_open = bool(r.json())
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"market_open={'true' if is_open else 'false'}\n")
          print("Market open today:", is_open)
          EOF

      - name: Run midday manager
        if: steps.holiday.outputs.market_open != 'false'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_midday.py | tee midday_out.txt

      - name: Commit logs
        if: always()
        run: |
          git config user.name "claude-trader-bot"
          git config user.email "actions@github.com"
          git add logs/ || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "logs: midday session $(TZ=America/New_York date +%F)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push

      - name: Notify phone
        if: always() && steps.holiday.outputs.market_open != 'false'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'EOF'
          import os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not topic:
              raise SystemExit(0)
          et_now = datetime.now(ZoneInfo("America/New_York")).strftime("%-I:%M %p ET")
          try:
              msg = open("midday_out.txt").read().strip()[:800] or "Midday session ran."
          except FileNotFoundError:
              msg = "Midday session FAILED before producing output — check Actions."
          req = urllib.request.Request(
              f"https://ntfy.sh/{topic}", data=f"[{et_now}] {msg}".encode(),
              headers={"Title": f"Claude Trader: midday manager ({et_now})", "Tags": "scales"})
          urllib.request.urlopen(req, timeout=30)
          EOF
