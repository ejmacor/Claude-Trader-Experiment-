name = "claude-trader-scheduler"
main = "worker.js"
compatibility_date = "2026-09-02"

# ONE trigger. Cloudflare caps Cron Triggers at 3 per Worker on the free plan,
# so the seven jobs are multiplexed inside worker.js instead. Every dispatch
# time lands on a :10 boundary, so this tick hits all of them exactly.
# 12:00-23:00 UTC weekdays covers 8:00am - 7:00pm ET.
[triggers]
crons = ["*/10 12-23 * * 1-5"]
